version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: demo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: demo_socket
      MYSQL_USER: hanhlt
      MYSQL_PASSWORD: 123456
    ports:
      - "3307:3306"
    networks:
      - backend

  redis:
    image: redis:7.2
    container_name: demo-redis
    ports:
      - "6379:6379"
    networks:
      - backend

  demo-app:
    build: .
    container_name: demo-app
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:8080"
    environment:
       DB_URL: jdbc:mysql://demo-mysql:3306/demo_socket
       DB_USERNAME: hanhlt
       DB_PASSWORD: 123456
       SPRING_DATA_REDIS_HOST: redis
       SPRING_DATA_REDIS_PORT: 6379
    networks:
      - backend

networks:
  backend: